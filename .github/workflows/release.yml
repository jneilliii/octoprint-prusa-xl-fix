name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        working-directory: prusa-xl-fix
        run: python -B -m unittest discover -s tests -v

      # A release is published only when the version in pyproject.toml has no
      # release yet; bump the version to publish an update to OctoPrint.
      - name: Build tarball
        id: build
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' prusa-xl-fix/pyproject.toml)
          sh create_tarball.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=octoprint_prusaxltoolfix-$version.tar.gz" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in prusa-xl-fix/pyproject.toml to publish a new release."
            exit 0
          fi
          gh release create "$TAG" "$ARCHIVE" \
            --target "$GITHUB_SHA" \
            --title "Prusa XL/XL+ fix $VERSION" \
            --generate-notes
